[workspace]
members = ["cmtool-data","cmtool-core","cmtool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Benjamin Casale"]
description = "Compartment Modelling Approach tool"
documentation = ""


[profile.release-performance]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "none"
panic = "unwind"
incremental = false
opt-level = 3
debug = 1
overflow-checks = false


[workspace.dependencies]
cmtool-core = { version = "0.1.0", path = "./cmtool-core" }
cmtool-data = { version = "0.1.0", path = "./cmtool-data" }
serde = { version = "1.0.219", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.140"
thiserror = "2.0.12"