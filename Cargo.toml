[workspace]
members = ["cmtool-data", "cmtool-core", "cmtool", "cmtool-python"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
authors = ["Benjamin Casale"]
description = "Compartment Modelling Approach tool"
documentation = ""
license = "GPL-3.0-or-later"


[profile.release-performance]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "none"
panic = "unwind"
incremental = false
opt-level = 3
debug = 1
overflow-checks = false


[workspace.dependencies]
cmtool-core = { version = "0.1.0", path = "./cmtool-core" }
cmtool-data = { version = "0.1.0", path = "./cmtool-data"}
serde = { version = "1.0.219", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.140"
thiserror = "2.0.12"
enum_dispatch = "0.3.13"
clap = { version = "4.5.41", features = ["derive"] }

# python

pyo3 = { version = "0.24.0" ,features = ["abi3-py310","extension-module"]}
