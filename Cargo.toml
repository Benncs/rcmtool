[workspace]
members = [
  "cmtool-data",
  "cmtool-core",
  "cmtool",
  "cmtool-python",
  "cmtool-cxx",
  'cmtool-assemble',
  "examples",
]
resolver = "3"
metadata.crane.name = "cmtool"

[workspace.package]
version = "0.1.4"
edition = "2024"
authors = ["Benjamin Casale"]
description = "Compartment Modelling Approach tool"
documentation = ""
license = "GPL-3.0-or-later"


[profile.release-performance]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "none"
panic = "unwind"
incremental = false
opt-level = 3
debug = 0
overflow-checks = false


[workspace.dependencies]
cmtool-core = { path = "./cmtool-core" }
cmtool-data = { path = "./cmtool-data" }
cmtool-assemble = { path = "./cmtool-assemble" }

serde = { version = "1.0.219", features = ["derive"] }
#serde_cbor = "0.11.2"
serde_json = "1.0.140"
serde-xml-rs = "0.8.1"
serde_xml = "0.9.1"
thiserror = "2.0.12"
enum_dispatch = "0.3.13"
clap = { version = "4.5.41", features = ["derive"] }
xsd-parser = "1.5.0"
#
nalgebra = "0.34.1"
nalgebra-sparse = "0.11.0"
ndarray = "0.17.2"
# python

numpy = "0.28.0"
pyo3 = { version = "0.28.1", features = ["abi3-py310", "extension-module"] }
