[workspace]
members = ["cmtool-data","cmtool-core","cmtool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Benjamin Casale"]
description = "Compartment Modelling Approach tool"
documentation = ""


[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

[workspace.dependencies]
cmtool-core = { version = "0.1.0", path = "./cmtool-core" }